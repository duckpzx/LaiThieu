<script>
/* ================= CẤU HÌNH ================= */
const CFG={lat:10.899174659008123,lng:106.69777577115912,radius:120,maxAcc:250,late:'07:30',pins:{nv:'2026',ql:'8888'},staleMs:180000,beatMs:60000,
 /* DÁN CẤU HÌNH FIREBASE VÀO ĐÂY (xem hướng dẫn). Để trống = chạy cục bộ, chưa realtime */
 fb:{apiKey:'AIzaSyAQHKpqd_DWXCrOtpWfAUx6K1gr387USek',authDomain:'laithieu-c5e3b.firebaseapp.com',
  /* Kiểm tra lại địa chỉ này ở trang Realtime Database (đầu trang); nếu khác thì sửa */
  databaseURL:'https://laithieu-c5e3b-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId:'laithieu-c5e3b',appId:'1:130149669743:web:c86fb4a98ac24a01d8669a'}};

/* Khu vực trên lưới 12x7 (x,y,rộng,cao). Phòng họp/Pantry là khu dùng chung */
const ZONES=[
 {id:'ql',n:'Phòng Quản lý',c:'#22d3ee',f:'#c9a574',x:0,y:0,w:3,h:3},
 {id:'trong',n:'Phòng Trong cùng',c:'#34d399',f:'#9aa0bd',x:3,y:0,w:6,h:3},
 {id:'vs',n:'Phòng vệ sinh',c:'#a78bfa',f:'#7f93b8',x:9,y:0,w:3,h:3},
 {id:'giua',n:'Phòng Giữa',c:'#fbbf24',f:'#c9a574',x:0,y:4,w:6,h:3},
 {id:'ngoai',n:'Phòng Ngoài',c:'#f472b6',f:'#b89a78',x:6,y:4,w:6,h:3}];
const ZN=Object.fromEntries(ZONES.map(z=>[z.id,z]));

const STAFF=[];

const STC={in:'#34d399',late:'#fbbf24',lunch:'#a78bfa',away:'#fb923c',out:'#60a5fa'};
/* ================= TIỆN ÍCH ================= */
const $=s=>document.querySelector(s);
const hhmm=()=>new Date().toTimeString().slice(0,5);
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shade=(h,a)=>{const n=parseInt(h.slice(1),16);const f=v=>Math.max(0,Math.min(255,v+a));return'#'+[n>>16,n>>8&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join('')};
const haversine=(a,b,c,d)=>{const R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
/* Nhân vật cố định theo seed */
const SKIN=['#f1c9a5','#e0ac82','#c68a5e','#8d5a3b'],HAIR=['#1b1b1f','#3b2a1f','#6b4423','#d9b36a','#9b3d3d'],SHIRT=['#22d3ee','#f472b6','#34d399','#fbbf24','#a78bfa','#fb923c','#60a5fa','#f87171'];
function look(seed){const r=rng(seed);const p=a=>a[Math.floor(r()*a.length)];return{skin:p(SKIN),hair:p(HAIR),shirt:p(SHIRT),style:Math.floor(r()*3),acc:Math.floor(r()*3)}}
/* ================= DỮ LIỆU CÁN BỘ ================= */
const seatN={};
const cols=z=>Math.floor(z.w/1.4);
function seatOf(d,self){const z=ZN[d],nc=cols(z),used=new Set(people.filter(p=>p!==self&&p.room===d&&present(p)).map(p=>p.seat[2]));let k=0;while(used.has(k)&&k<nc*2-1)k++;return[z.x+.4+(k%nc)*1.4+.45,z.y+.5+Math.floor(k/nc)*1.3+.95,k]}
const people=[];
function mk(id,name,level,dept,st,inAt,seat){const seed=hash(id+name);return{id,name,level,room:level==='ql'?'ql':'ngoai',role:level==='ql'?'Quản lý':'Nhân viên',dept,st,inAt,seat,seed,L:look(seed),x:seat[0],y:seat[1],mode:'sit',t:Math.random()*8,path:[],dest:'seat',zone:dept}}
const acts=[];
const present=p=>p.st==='in'||p.st==='late';
const rn=p=>(ZN[p.room]||ZONES[0]).n;
/* ================= CẢNH ISOMETRIC (Canvas 2D, nhẹ, không cần WebGL) ================= */
const cv=$('#cv'),g=cv.getContext('2d');
let W=0,H=0,zm=1,tzm=1,rot=0,cen=[6,3.5],tcen=[6,3.5],Z=1,ox=0,oy=0,playing=true,focus=null;
const TW=64,TH=32,UH=34;
function rt(x,y){return rot==0?[x,y]:rot==1?[MH-y,x]:rot==2?[MW-x,MH-y]:[y,MW-x]}
const Pr=(X,Y,z)=>[(X-Y)*TW/2*Z+ox,(X+Y)*TH/2*Z-z*UH*Z+oy];
const P=(x,y,z=0)=>{const r=rt(x,y);return Pr(r[0],r[1],z)};
function resize(){const d=Math.min(devicePixelRatio||1,2),r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
new ResizeObserver(resize).observe(cv);
function poly(pts,fill,stroke,lw=1){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function box(x,y,w,d,h,c,z0=0){const a=rt(x,y),b=rt(x+w,y+d),x0=Math.min(a[0],b[0]),x1=Math.max(a[0],b[0]),y0=Math.min(a[1],b[1]),y1=Math.max(a[1],b[1]),Q=(X,Y,z)=>Pr(X,Y,z),t=z0+h;
 poly([Q(x0,y1,z0),Q(x1,y1,z0),Q(x1,y1,t),Q(x0,y1,t)],shade(c,-30));
 poly([Q(x1,y0,z0),Q(x1,y1,z0),Q(x1,y1,t),Q(x1,y0,t)],shade(c,-55));
 poly([Q(x0,y0,t),Q(x1,y0,t),Q(x1,y1,t),Q(x0,y1,t)],c)}
function disc(x,y,r,h,c,z0=0){const p=P(x,y,z0),q=P(x,y,z0+h);g.fillStyle=shade(c,-45);g.beginPath();g.ellipse(p[0],p[1],r*TW/2*Z,r*TH/2*Z,0,0,7);g.fill();g.fillRect(q[0]-r*TW/2*Z,q[1],r*TW*Z,p[1]-q[1]);g.fillStyle=c;g.beginPath();g.ellipse(q[0],q[1],r*TW/2*Z,r*TH/2*Z,0,0,7);g.fill()}
function plant(x,y){box(x-.12,y-.12,.24,.24,.22,'#7a4b2a');const p=P(x,y,.75),r=.3*TW/2*Z;g.fillStyle='#16a34a';g.beginPath();g.arc(p[0],p[1],r,0,7);g.fill();g.fillStyle='#4ade80';g.beginPath();g.arc(p[0]-r*.3,p[1]-r*.3,r*.55,0,7);g.fill()}
function items(){const L=[];const add=(x,y,f)=>{const r=rt(x,y);L.push({d:r[0]+r[1],f})};
 ZONES.forEach(z=>{
  if(DESKS.includes(z.id)){const nc=cols(z);
   for(let k=0;k<nc*2;k++){const dx=z.x+.4+(k%nc)*1.4,dy=z.y+.5+Math.floor(k/nc)*1.3;
    add(dx+.45,dy+.3,()=>{box(dx,dy,.9,.6,.45,'#a9714b');box(dx+.3,dy+.15,.35,.08,.35,'#10142e',.45);const c=P(dx+.45,dy+.9,0);g.fillStyle='#2a2f5e';g.beginPath();g.arc(c[0],c[1]-6*Z,5*Z,0,7);g.fill()})}
   add(z.x+1.5,z.y+.12,()=>box(z.x+.3,z.y+.02,1.5,.22,1.1,'#5b3a29'));
   add(z.x+z.w-.3,z.y+2.8,()=>plant(z.x+z.w-.3,z.y+2.8))}
  if(z.id==='vs'){for(let k=0;k<3;k++){const sx=z.x+.5+k*.9;add(sx+.3,z.y+.6,()=>box(sx,z.y+.1,.7,.9,.9,'#e2e8f0'))}add(z.x+2,z.y+2.5,()=>box(z.x+1.2,z.y+2.3,1.6,.5,.7,'#cbd5e1'))}});
 return L}
function floor(){box(0,0,MW,MH,.25,'#161a45',-.25);
 for(let i=0;i<MW;i++)for(let j=0;j<MH;j++){const z=ZONES.find(z=>i>=z.x&&i<z.x+z.w&&j>=z.y&&j<z.y+z.h);const c=z?shade(z.f,(i+j)%2?-14:0):((i+j)%2?'#1c2152':'#222862');
  const r=[[i,j],[i+1,j],[i+1,j+1],[i,j+1]].map(q=>P(q[0],q[1]));poly(r,c)}
 g.save();g.shadowBlur=12;ZONES.forEach(z=>{g.shadowColor=z.c;poly([[z.x,z.y],[z.x+z.w,z.y],[z.x+z.w,z.y+z.h],[z.x,z.y+z.h]].map(q=>P(q[0],q[1])),null,z.c,2)});g.restore()}
function person(p){const[sx,sy]=P(p.x,p.y);p.sx=sx;p.sy=sy;const s=Z*.95,sit=p.mode==='sit',L=p.L,mv=p.mode==='walk',sw=mv?Math.sin(performance.now()/110+p.seed)*3*s:0;
 g.fillStyle='#0006';g.beginPath();g.ellipse(sx,sy,9*s,4*s,0,0,7);g.fill();
 const b=sy-(sit?2:0)*s;
 if(!sit){g.fillStyle='#1f2347';g.fillRect(sx-5*s+sw,b-10*s,4*s,10*s);g.fillRect(sx+1*s-sw,b-10*s,4*s,10*s)}
 const ty=b-(sit?6:10)*s-12*s;g.fillStyle=L.shirt;g.beginPath();g.roundRect(sx-6*s,ty,12*s,12*s,3*s);g.fill();
 if(p.dept==='ql'){g.fillStyle='#ef4444';g.fillRect(sx-1*s,ty+1*s,2*s,7*s)}
 const hy=ty-5*s;g.fillStyle=L.skin;g.beginPath();g.arc(sx,hy,6*s,0,7);g.fill();
 g.fillStyle=L.hair;g.beginPath();g.arc(sx,hy-.5*s,6.3*s,Math.PI,0);g.fill();

function rtBeat(){if(online&&me&&present(me))db.ref('presence/'+uid+'/lastSeen').set(TS())}
/* Quá 3 phút không có nhịp tim → coi là đã rời */
setInterval(()=>{if(!online)return;const now=Date.now()+offset;people.forEach(p=>{if(!p.me&&present(p)&&p.last&&now-p.last>CFG.staleMs){p.st='out';acts.unshift({t:hhmm(),tx:p.name+' đã rời (mất tín hiệu)',z:rn(p)});render()}})},5000);
/* Hộp thoại giải thích trước khi xin quyền vị trí */
function showLoc(denied){const m=$('#locModal'),b=$('#lbtn');m.style.display='grid';
 if(!denied){$('#lt').textContent='Cần cấp quyền truy cập vị trí';
  $('#lb').innerHTML=`<p>Để xác định bạn có đang ở <b>Đảng ủy phường Lái Thiêu</b> hay không (trong bán kính ${CFG.radius} m), ứng dụng cần truy cập vị trí điện thoại của bạn. Nếu bạn đang ở Đảng ủy, nhân vật của bạn sẽ hiện trong văn phòng số và bạn được ghi nhận có mặt.</p>
  <ul><li>✅ Chỉ so khoảng cách với vị trí Đảng ủy</li><li>✅ <b>Không lưu tọa độ</b> của bạn, chỉ lưu trạng thái có mặt/vắng mặt và giờ vào – ra</li><li>✅ Chỉ hoạt động khi bạn đang mở ứng dụng</li></ul>
  <p>Ở bước tiếp theo, trình duyệt sẽ hỏi quyền. Hãy chọn <b>Cho phép</b> (Allow) và bật <b>Vị trí chính xác</b>.</p>`;
  b.textContent='Tôi đã hiểu – Cho phép vị trí';b.onclick=()=>{m.style.display='none';startGeo()}}
 else{$('#lt').textContent='Vị trí đang bị chặn';
  $('#lb').innerHTML=`<p>Ứng dụng chưa được cấp quyền vị trí nên không xác định được bạn có đang ở Đảng ủy phường Lái Thiêu hay không. Hãy bật lại quyền:</p>
  <ul><li>📱 <b>Android (Chrome):</b> bấm biểu tượng ổ khóa cạnh địa chỉ → Quyền → Vị trí → Cho phép</li><li>🍎 <b>iPhone:</b> Cài đặt → Quyền riêng tư → Dịch vụ định vị → Safari/Chrome → Khi dùng ứng dụng</li></ul><p>Sau đó bấm nút bên dưới.</p>`;
  b.textContent='Tôi đã bật – Thử lại';b.onclick=()=>location.reload()}}
async function askLoc(){if(DEMO){startGeo();return}
 if(navigator.permissions){try{const r=await navigator.permissions.query({name:'geolocation'});
  if(r.state==='granted'){startGeo();return}if(r.state==='denied'){geo('bad','Chưa có quyền vị trí.');showLoc(true);return}}catch(e){}}
 if(localStorage.getItem('ptv_locok')){startGeo();return}/* trình duyệt không hỗ trợ kiểm tra quyền (vd Safari): đã từng cho phép thì khỏi hỏi lại */
 showLoc()}
/* Heartbeat: quá 3 phút mất tín hiệu → đã rời */
setInterval(()=>{rtBeat();if(me&&present(me)&&Date.now()-lastGeo>CFG.staleMs){checkOut();geo('warn','Mất tín hiệu quá 3 phút, trạng thái: Đã rời.')}},CFG.beatMs);
$('#pf').onsubmit=e=>{e.preventDefault();const lv=$('#pl').value;if($('#pp').value!==CFG.pins[lv]){alert('Sai mã PIN');return}
 prof={id:'me_'+Math.random().toString(36).slice(2,9),name:$('#pn').value.trim(),level:lv,dept:lv};localStorage.setItem('ptv_profile',JSON.stringify(prof));$('#modal').style.display='none';applyRole();askLoc()};
if(!prof)$('#modal').style.display='grid';else{applyRole();askLoc()}
resize();render();requestAnimationFrame(frame);
</script></body></html>
